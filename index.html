<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>کافی نت حافظ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #dfe9f3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 25px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 15px;
            background: #1677ff;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
        }

        h1 {
            margin: 10px 0;
            color: #222;
            font-size: 27px;
        }

        .address {
            color: #666;
            line-height: 2;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .phone {
            display: block;
            text-decoration: none;
            color: #1677ff;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .contact-btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 14px;
            background: #222;
            color: white;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
        }

        .title {
            font-size: 16px;
            color: #555;
            margin-bottom: 15px;
        }

        .social {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social a {
            text-decoration: none;
            color: white;
            padding: 15px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: bold;
        }

        .eitaa {
            background: #f39c12;
        }

        .rubika {
            background: #2196f3;
        }

        .bale {
            background: #20b26b;
        }

        .social a:hover,
        .contact-btn:hover {
            opacity: 0.85;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">ح</div>

    <div class="address">

        طبقه زیرین بانک شهر
    </div>

    <a class="phone" href="tel:09056481654">
        📞 09056481654
    </a>

    <a class="contact-btn" href="tel:09056481654">
        📱 افزودن / تماس با کافی نت حافظ
    </a>

    <div class="title">
        از طریق پیام‌رسان موردنظر با ما در ارتباط باشید
    </div>

    <div class="social">

        <a class="eitaa"
           href="https://eitaa.com/hafez_cafe"
           target="_blank">
            🟠 ایتا
        </a>

        <a class="rubika"
           href="https://rubika.ir/hafez_cafe"
           target="_blank">
            🔵 روبیکا
        </a>

        <a class="bale"

        </a>

    </div>

    <div class="footer">
        کافی نت حافظ | خدمات اینترنتی و اداری
    </div>

</div>

</body>
</html>
